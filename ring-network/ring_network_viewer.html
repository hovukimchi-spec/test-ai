<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f6f7f9;--fg:#1d2433;--card:#fff;--mut:#667085;--line:#d9dde5;--acc:#1f3864;--ok:#1a9e55;--warn:#e0a100;--bad:#d62839}
:root[data-theme=dark]{--bg:#12151c;--fg:#e8ebf1;--card:#1c212b;--mut:#98a2b3;--line:#323a4a;--acc:#8fb4ff;--ok:#41c785;--warn:#f0b429;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;flex:1}select{max-width:100%}button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}main{padding:10px 12px}.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
#map{width:100%;height:68vh;min-height:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:grab}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}.zb button{width:36px;height:36px;padding:0;font-size:18px;line-height:1}#mapw{position:relative}
svg text{font:10px system-ui;fill:var(--fg);paint-order:stroke;stroke:var(--card);stroke-width:2.5px}
.seg{fill:none;stroke-width:3;cursor:pointer;opacity:.85}.seg:hover{stroke-width:5}.seg.cut{stroke:var(--bad)!important;stroke-dasharray:5 4;stroke-width:4}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.leg span{display:inline-flex;align-items:center;gap:4px;font-size:12px}.leg i{width:14px;height:5px;display:inline-block;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.b{font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0004;transform:translateY(105%);transition:transform .2s;z-index:9}
#sheet.on{transform:none}#sheet .x{position:absolute;right:10px;top:8px}
.ports{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}.port{border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;font-size:11px;min-height:38px}
.port b{display:block;color:var(--mut);font-size:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
small,.mut{color:var(--mut)}@media(min-width:900px){main{max-width:1100px;margin:auto}}

header .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#src{font-size:12px;color:var(--mut);padding:2px 12px 6px;background:var(--card);border-bottom:1px solid var(--line)}
#src .dirty{color:var(--warn);font-weight:700}
.mxl{max-height:30vh;overflow:auto;margin-bottom:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.mxi{border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:var(--card)}.mxi.sel{outline:2px solid var(--acc)}
.mxi .t{font-weight:600;font-size:13px}.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:0 6px;margin:1px 2px 0 0;color:var(--mut)}
.cs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.cc{width:54px;border:1px solid var(--line);border-radius:8px;padding:2px 2px 3px;text-align:center;font-size:11px;line-height:1.15;cursor:pointer;background:var(--card);position:relative}
.cc .n{display:flex;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10px}.cc .n i{width:9px;height:9px;border-radius:50%;border:1px solid #0005;display:inline-block}
.cc .l{font-weight:700;font-size:13px;min-height:16px}.cc .s{font-size:9.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc.ov{box-shadow:inset 0 0 0 2px var(--acc)}.cc.hu{background:color-mix(in srgb,var(--bad) 25%,transparent)}.cc.run{border-color:var(--ok)}
.cc.sel{outline:2px solid var(--warn)}
.fld{display:grid;grid-template-columns:110px 1fr;gap:6px;align-items:center;margin:4px 0}.fld input[type=text],.fld input[type=number]{width:100%}
.mxsvg text{font:10px system-ui}
</style></head><body>
<header><h1>Ring CSG Nhà Bè <small id="sub"></small></h1><div class="tools"><button id="bOpen">📂 Mở Excel</button><button id="bSave">💾 Lưu Excel</button><button id="theme" aria-label="sáng/tối">◐</button></div><input type="file" id="fIn" accept=".xlsx" style="display:none"></header>
<div id="src"></div>
<nav id="tabs"></nav>
<main>
<section class="pane on" id="p-map"><div class="row"><button id="simBtn">⚡ Giả lập sự cố</button><span class="mut" id="simHint">Bấm đoạn/nút để xem chi tiết.</span></div>
<div class="row" id="ringSel"></div>
<div id="mapw"><div class="zb"><button id="zIn" aria-label="phóng to">+</button><button id="zOut" aria-label="thu nhỏ">−</button><button id="zRst" aria-label="về ban đầu" style="font-size:13px">⟲</button></div><svg id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg></div><div class="leg" id="leg"></div>
<div class="card" id="simOut" style="display:none"></div></section>
<section class="pane" id="p-mx"><div class="row"><input id="mxQ" type="search" placeholder="Tìm măng xông (tên, trạm, cáp)…" style="flex:1;min-width:160px"><label class="mut"><input type="checkbox" id="mxOnlyL"> chỉ MX có nhãn/ghi chú thiếu</label></div><div class="mxl" id="mxList"></div><div id="mxDetail"></div></section>
<section class="pane" id="p-ring"><div id="rings"></div></section>

<section class="pane" id="p-otdr"><div class="card"><div class="row"><select id="oSeg"></select><select id="oFrom"></select><input id="oM" type="number" inputmode="numeric" placeholder="OTDR (m)" style="width:110px"><button id="oGo">Tìm</button></div><div id="oOut" class="mut">Chọn đoạn, đầu đo và khoảng cách OTDR (m).</div></div></section>

</main><div id="sheet"><button class="x" onclick="closeSheet()">✕</button><div id="sheetBody"></div></div>
<script>
/* Động cơ tính toán mạng ring (JS) — bản port của model.py để HTML tự tính lại khi sửa dữ liệu.
   Đầu vào RAW = {static:{...}, layer:{cables,links,steps,labels}}; đầu ra D (xem cuối file).
   Không dùng DOM: chạy được trong trình duyệt và Node (kiểm thử đối chiếu với Python). */
(function(root){
'use strict';
const CFG={drop_max_m:300,drop_min_fo:12};
const toInt=x=>parseInt(x,10);
function toCores(v){ if(Array.isArray(v))return v.map(Number); if(v===null||v===undefined||v==='')return []; return String(v).split(/[,+; ]+/).filter(s=>s!=='').map(Number); }
function toNum(v){ if(v===null||v===undefined||v==='')return null; const n=Number(String(v).replace(',','.')); return isNaN(n)?null:n; }
function parseEnds(s){ const o={}; if(!s)return o; String(s).split(';').forEach(p=>{p=p.trim(); const i=p.indexOf('='); if(i>0)o[p.slice(0,i).trim()]=p.slice(i+1).trim();}); return o; }
function parseSubst(s){ if(!s)return null; const o={}; String(s).split(/[;,]/).forEach(p=>{const[a,b]=p.split(':'); if(a&&b)o[a.trim()]=Number(b);}); return Object.keys(o).length?o:null; }
const isHu=s=>/(^|[^\p{L}\p{N}_])h[uư]($|[^\p{L}\p{N}_])|\[hư\]/u.test(String(s).toLowerCase());
function rng(xs){ xs=[...new Set(xs)].sort((a,b)=>a-b); if(!xs.length)return ''; const out=[]; let st=xs[0],pv=xs[0];
  for(let i=1;i<=xs.length;i++){ const x=xs[i]; if(x!==undefined&&x===pv+1){pv=x;continue;} out.push(st===pv?String(st):st+'-'+pv); if(x!==undefined){st=pv=x;} }
  return out.join(','); }
function stationOf(name){ const n=String(name).toUpperCase(); if(n.startsWith('HNB')){const m=n.match(/^HNB\d+/); return m?m[0]:null;}
  if(n.includes('NBE22'))return 'NBE22'; if(n.includes('NBE12')||n.includes('VNPT LONG THỚI'))return 'NBE12'; return null; }

/* ---- ghép nhãn: cùng nhãn = cùng nhóm hàn; sợi nhỏ hàn sợi nhỏ ---- */
function splicePairs(ends){ // ends: [[id,[labels...]],...]
  const pairs=[],warn=[]; const labs=new Set(); ends.forEach(([e,v])=>v.forEach(l=>{if(l&&l!=='HƯ')labs.add(l);}));
  [...labs].sort().forEach(lab=>{
    const pos=[]; ends.forEach(([e,v])=>{ if(v.includes(lab))pos.push([e,v.map((l,i)=>l===lab?i+1:0).filter(x=>x)]); });
    if(pos.length===1){warn.push(`nhãn ${lab}: chỉ có ở một đầu cáp (${pos[0][0]})`);return;}
    if(pos.length>2){warn.push(`nhãn ${lab}: có ở ${pos.length} đầu cáp, cần chỉ định cặp`);return;}
    const [a,pa]=pos[0],[b,pb]=pos[1]; const bal=pa.length===pb.length;
    if(!bal)warn.push(`nhãn ${lab}: số sợi khác nhau (${a}:${pa.length} vs ${b}:${pb.length})`);
    const n=Math.min(pa.length,pb.length); for(let i=0;i<n;i++)pairs.push({label:lab,a,core_a:pa[i],b,core_b:pb[i],balanced:bal});
  });
  return {pairs,warn};
}
function checkSplice(pairs,a,ca,b,cb,subst,nominalB){
  if(!a||!b)return ['chưa có sơ đồ','không xác định cáp trong sơ đồ MX'];
  const m=new Map();
  pairs.forEach(p=>{ if(p.a===a&&p.b===b)m.set(p.core_a,[p.core_b,p.label]); else if(p.a===b&&p.b===a)m.set(p.core_b,[p.core_a,p.label]); });
  if(!ca.some(c=>m.has(c)))return ['chưa có nhãn','sơ đồ MX chưa ghi nhãn cho các core này'];
  const bad=[]; let ok=true;
  for(let i=0;i<Math.min(ca.length,cb.length);i++){ const x=ca[i],y=cb[i]; if(m.has(x)&&m.get(x)[0]===y)continue; ok=false; bad.push(`core ${x}→${m.has(x)?m.get(x)[0]:'?'} (sơ đồ) ≠ ${y} (mô tả)`); }
  if(ok)return ['khớp sơ đồ','nhãn '+[...new Set(ca.filter(x=>m.has(x)).map(x=>m.get(x)[1]))].sort().join(',')];
  if(subst&&nominalB){ const act=nominalB.map(n=>subst[String(n)]!==undefined?subst[String(n)]:n);
    const setCb=new Set(cb), setM=new Set(ca.filter(x=>m.has(x)).map(x=>m.get(x)[0]));
    if(act.length===cb.length&&act.every((v,i)=>v===cb[i])&&setCb.size===setM.size&&[...setCb].every(v=>setM.has(v)))
      return ['khớp sơ đồ (thay core hư)','thiết kế '+ca.map((x,i)=>`${x}↔${nominalB[i]}`).join('+')+'; thực tế '+ca.map((x,i)=>`${x}↔${cb[i]}`).join('+')]; }
  if(ca.every(x=>m.has(x))){ const sm=new Set(ca.map(x=>m.get(x)[0])), sc=new Set(cb); if(sm.size===sc.size&&[...sm].every(v=>sc.has(v)))return ['khớp nhóm, THỨ TỰ KHÁC','cùng nhóm core: '+bad.join('; ')]; }
  return ['KHÁC sơ đồ',bad.join('; ')];
}

function compute(RAW){
  const S=RAW.static,L=RAW.layer,CF=S.config||CFG;
  const drop_max=CF.drop_max_m||300, drop_min=CF.drop_min_fo||12;
  /* --- cáp --- */
  const cables={}; L.cables.forEach(r=>{ cables[r.id]={id:r.id,name:r.name||'',fo:toInt(r.fo),frm:r.frm||'',to:r.to||'',len_m:toNum(r.len_m)||0,so_row:r.so_row||null,
     ma_cap:r.ma_cap||'',cs_dau:r.cs_dau===undefined||r.cs_dau===null?'':String(r.cs_dau),cs_cuoi:r.cs_cuoi===undefined||r.cs_cuoi===null?'':String(r.cs_cuoi),src:r.src||'',so_dau_cuoi:r.so_dau_cuoi||'',ends:parseEnds(r.ends)}; });
  const omap=S.odf_core_map; const omapNb={}; Object.entries(omap['ODF-01 NBE12']).forEach(([k,v])=>omapNb[Number(k)]=v);
  /* --- nhãn sơ đồ MX (gốc) --- */
  const mxcaps=S.mxcap, byCap={}; S.mxcore.forEach(r=>{(byCap[r.cap_id]=byCap[r.cap_id]||[]).push(r);});
  const mxList=[...new Set(mxcaps.map(c=>c.mx))];
  const mxpairs=[],mxwarn=[];
  mxList.forEach(mx=>{ const ids=mxcaps.filter(c=>c.mx===mx).map(c=>c.cap_id); const ends=[],info={};
    ids.forEach(i=>{ const rows=byCap[i]||[]; const n=Math.max(...rows.map(r=>toInt(r.core))); const arr=new Array(n).fill(''); info[i]={};
      rows.forEach(r=>{arr[toInt(r.core)-1]=r.nhan; info[i][toInt(r.core)]=r;}); ends.push([i,arr]); });
    const {pairs,warn}=splicePairs(ends);
    pairs.forEach(p=>{ const ra=info[p.a][p.core_a],rb=info[p.b][p.core_b]; mxpairs.push({mx,label:p.label,a:p.a,core_a:p.core_a,color_a:ra.mau_soi,tube_a:ra.ong,b:p.b,core_b:p.core_b,color_b:rb.mau_soi,tube_b:rb.ong,station:ra.tram||rb.tram||'',balanced:p.balanced}); });
    warn.forEach(w=>mxwarn.push([mx,w]));
    ends.forEach(([i,arr])=>{ if(!arr.some(x=>x)){const c=mxcaps.find(x=>x.cap_id===i); mxwarn.push([mx,`${c.o_goc}: chưa ghi nhãn core (chưa có dữ liệu phối)`]);} });
  });
  /* --- nhãn nhập tay (lớp sửa) --- */
  const labs=(L.labels||[]).map(r=>({mx:r.mx,cable:r.cable,core:toInt(r.core),nhan:(r.nhan||'').trim(),tram:(r.tram||'').trim(),hu:!!(r.hu&&String(r.hu)!=='0')}));
  const ovPairs=[]; const grp={};
  labs.forEach(r=>{ if(r.nhan){const k=r.mx+'\u0000'+r.nhan;(grp[k]=grp[k]||[]).push(r);} });
  Object.entries(grp).forEach(([k,rs])=>{ const [mx,lab]=k.split('\u0000'); const by={}; rs.forEach(r=>{(by[r.cable]=by[r.cable]||[]).push(r);});
    const keys=Object.keys(by).sort(); if(keys.length!==2)return; const A=by[keys[0]].sort((x,y)=>x.core-y.core),B=by[keys[1]].sort((x,y)=>x.core-y.core);
    for(let i=0;i<Math.min(A.length,B.length);i++)ovPairs.push({mx,label:lab,a:'CAB:'+keys[0],core_a:A[i].core,b:'CAB:'+keys[1],core_b:B[i].core,station:A[i].tram||B[i].tram||'',source:'nhập tay'}); });
  /* --- đường đi --- */
  const paths=[]; L.links.forEach(lk=>{
    let tot=0; const steps=[]; const raw=L.steps.filter(s=>s.link===lk.id).sort((a,b)=>toInt(a.seq)-toInt(b.seq));
    raw.forEach(s=>{ const t=s.t; const st={t,at:s.at||'',name:s.name||'',note:s.note||'',odf_ref:s.odf_ref||''};
      if(t==='odf'){ st.cores=toCores(s.cores); if(st.odf_ref&&omap[st.odf_ref]){const inv={}; Object.entries(omap[st.odf_ref]).forEach(([k,v])=>inv[v]=Number(k)); st.ports=st.cores.map(c=>inv[c]!==undefined?inv[c]:c);} }
      else if(t==='cable'){ st.cable=s.cable; st.cores=toCores(s.cores); const c=cables[s.cable]; if(c){tot+=c.len_m; Object.assign(st,{name:c.name,fo:c.fo,frm:c.frm,to:c.to,len_m:c.len_m,src:c.src,cum:tot});} }
      else if(t==='mx'){ st.a_cable=s.a_cable; st.b_cable=s.b_cable; st.cores_a=toCores(s.cores_a); st.cores_b=toCores(s.cores_b); st.subst=parseSubst(s.subst); st.nominal_b=s.nominal_b?toCores(s.nominal_b):null;
        const ea=(cables[st.a_cable]&&cables[st.a_cable].ends[st.at])||('CAB:'+st.a_cable), eb=(cables[st.b_cable]&&cables[st.b_cable].ends[st.at])||('CAB:'+st.b_cable);
        let [ck,dt]=checkSplice(mxpairs,ea,st.cores_a,eb,st.cores_b,st.subst,st.nominal_b);
        if(ck.startsWith('chưa')&&ovPairs.length){ const [c2,t2]=checkSplice(ovPairs,'CAB:'+st.a_cable,st.cores_a,'CAB:'+st.b_cable,st.cores_b,st.subst,st.nominal_b); if(!c2.startsWith('chưa')){ck=c2+' (nhãn nhập tay)';dt=t2;} }
        st.check=ck; st.check_detail=dt; }
      else { st.cores=toCores(s.cores); }
      steps.push(st); });
    let bb=toNum(lk.bbnt_otdr_m); if(bb===null){ const sg=S.segments.find(x=>x.id===lk.id); bb=sg&&sg.km_otdr?Math.round(sg.km_otdr*1000):null; }
    const odfO=(lk.odf_otdr_m===undefined||lk.odf_otdr_m===null||lk.odf_otdr_m==='')?null:String(lk.odf_otdr_m).split(/[\/,; ]+/).filter(Boolean).map(Number);
    const ref=(odfO&&odfO[0])||bb||null;
    const dc=(lk.design_cables?String(lk.design_cables).split(/[,; ]+/).filter(Boolean):[]); const dz=dc.reduce((a,c)=>a+(cables[c]?cables[c].len_m:0),0)||null;
    paths.push({design_m:dz,ring:lk.ring,id:lk.id,frm:lk.frm,to:lk.to,total_m:tot,bbnt_otdr_m:bb,rerouted:!!(lk.rerouted&&String(lk.rerouted)!=='0'),note:lk.note||'',odf_otdr_m:odfO,ref_m:ref,complete:!(String(lk.complete)==='0'||lk.complete===false),steps});
  });
  /* --- AGG ODF sử dụng --- */
  const AGG_ODF={C01:['phai','ODF-02'],C22:['phai','ODF-01'],C35:['trai','ODF-01'],C17:['trai','ODF-02']};
  const other={}, linkport=[];
  Object.entries(AGG_ODF).forEach(([cid,[side,odfn]])=>{ S.odf_agg.forEach(r=>{ if(r.phia!==side||!String(r.odf).startsWith(odfn))return;
      const p=toInt(r.cong); const core=cid==='C22'?(omapNb[p]!==undefined?omapNb[p]:p):p; const dest=String(r.dich||'').trim(), note=String(r.ghi_chu||'').trim();
      if(/HNB\d+\s*ring/.test(dest))linkport.push([cid,p,core,dest.split(/\s+/)[0],dest]);
      else{ const bad=['cot1','cot2','cot3'].some(k=>/^h[uư]$/.test(String(r[k]).trim().toLowerCase())); other[cid+'|'+core]=(dest||'(trống)')+(note?' — '+note:'')+(bad?' [hư]':''); } }); });
  /* --- sổ cái core --- */
  const usage={}; paths.forEach(lk=>lk.steps.forEach(st=>{ if(st.t==='cable')st.cores.forEach(c=>{(usage[st.cable+'|'+c]=usage[st.cable+'|'+c]||[]).push(lk.id);}); }));
  const labmap={}; S.mxcore.forEach(r=>{labmap[r.cap_id+'|'+toInt(r.core)]=[r.nhan,r.tram];});
  const labByCable={}; labs.forEach(r=>{labByCable[r.cable+'|'+r.core+'|'+r.mx]=r;});
  const ledger=[],conflicts=[];
  Object.values(cables).forEach(c=>{ for(let core=1;core<=c.fo;core++){
    const use=[...new Set(usage[c.id+'|'+core]||[])].sort(); const lab=[],tr=[];

function polyLen(pm){let L=0;const c=[0];for(let i=1;i<pm.length;i++){L+=Math.hypot(pm[i][0]-pm[i-1][0],pm[i][1]-pm[i-1][1]);c.push(L)}return [L,c]}

 let h='';if(f>1.02)h+=`<div class="bad">Khoảng cách OTDR (${m} m) lớn hơn chiều dài đo của đoạn (${Math.round(tot)} m): kiểm tra đầu đo hoặc đoạn.</div>`;

function mxStat(m){const cabs=mxCables(m.name);const lab=cabs.reduce((a,x)=>a+x.cores.filter(c=>c.nhan).length,0);const runs=cabs.reduce((a,x)=>a+x.cores.filter(c=>c.links.length).length,0);const miss=E.paths.some(p=>p.steps.some(s=>s.t=='mx'&&s.at==m.name&&String(s.check).startsWith('chưa')));return {cabs,lab,runs,miss}}
function renderMxList(){const q=($('#mxQ').value||'').toLowerCase().trim(),only=$('#mxOnlyL').checked;
 const L=allMx().map(m=>Object.assign(m,mxStat(m))).filter(m=>(!q||(m.name+' '+m.cabs.map(c=>c.id+' '+c.c.ma_cap+' '+c.c.frm+' '+c.c.to).join(' ')).toLowerCase().includes(q))&&(!only||m.miss));
 $('#mxList').innerHTML=L.map(m=>`<div class="mxi${m.name==curMx?' sel':''}" onclick="goMx('${m.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"><div class="t">${esc_(m.name)}</div>${[...m.tags].map(t=>`<span class="tag">${t}</span>`).join('')}<div class="mut">${m.cabs.length} cáp · ${m.lab} core có nhãn · ${m.runs} core đang chạy${m.miss?' · <span class="warn">thiếu nhãn</span>':''}</div></div>`).join('')||'<div class="mut">Không có măng xông phù hợp.</div>'}
$('#mxQ').oninput=renderMxList;$('#mxOnlyL').onchange=renderMxList;
function goMx(name){curMx=name;curCore=null;curPair='';goTab('mx');renderMxList();renderMx(name);$('#mxDetail').scrollIntoView({behavior:'smooth',block:'start'})}
// ---- MX: chi tiết
function coreChip(mx,cid,c){const sel=curCore&&curCore[0]==cid&&curCore[1]==c.n;
 return `<div class="cc${c.ov?' ov':''}${c.hu?' hu':''}${c.links.length?' run':''}${sel?' sel':''}" title="${esc_([c.mau,'ống '+c.ong,c.links.join(', ')].filter(Boolean).join(' · '))}" onclick="editCore('${cid}',${c.n})"><div class="n"><i style="background:${fcol(c.n)}"></i>${c.n}</div><div class="l" style="color:${c.nhan?(c.hu?'var(--bad)':lcol(c.nhan)):'var(--mut)'}">${esc_(c.nhan)||'·'}</div><div class="s">${esc_(c.tram)||(c.links.length?c.links[0]:'')}</div></div>`}
function splicesSvg(name,cabs,pairs,A,B){const ca=cabs.find(x=>x.id==A),cb=cabs.find(x=>x.id==B);if(!ca||!cb)return '';
 const ps=pairs.filter(p=>(p.a==A&&p.b==B)||(p.a==B&&p.b==A)).map(p=>p.a==A?p:{label:p.label,a:A,ca:p.cb,b:B,cb:p.ca,station:p.station,src:p.src});
 const rh=17,n=Math.max(ca.c.fo,cb.c.fo),H=n*rh+24,W=360,xa=96,xb=W-96;const seen=new Set();
 let s=`<svg class="mxsvg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px"><text x="${xa-8}" y="11" text-anchor="end" font-weight="700" fill="currentColor">${A}</text><text x="${xb+8}" y="11" font-weight="700" fill="currentColor">${B}</text>`;
 const y=i=>20+(i-1)*rh+rh/2;
 for(let i=1;i<=ca.c.fo;i++){const c=ca.cores[i-1];s+=`<circle cx="${xa}" cy="${y(i)}" r="4.5" fill="${fcol(i)}" stroke="#0007"/><text x="${xa-8}" y="${y(i)+3.5}" text-anchor="end" fill="${c.hu?'#d62839':'currentColor'}">${i}${c.nhan?' '+esc_(c.nhan):''}</text>`}
 for(let i=1;i<=cb.c.fo;i++){const c=cb.cores[i-1];s+=`<circle cx="${xb}" cy="${y(i)}" r="4.5" fill="${fcol(i)}" stroke="#0007"/><text x="${xb+8}" y="${y(i)+3.5}" fill="${c.hu?'#d62839':'currentColor'}">${i}${c.nhan?' '+esc_(c.nhan):''}</text>`}
 ps.forEach(p=>{const k=p.ca+'-'+p.cb+p.src;if(seen.has(k))return;seen.add(k);const col=p.label?lcol(p.label):'#888';const dash=p.src.startsWith('đường đi')?'4 3':p.src=='MX thẳng'?'1 3':'';
  s+=`<line x1="${xa}" y1="${y(p.ca)}" x2="${xb}" y2="${y(p.cb)}" stroke="${col}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}><title>${A} ${p.ca} ↔ ${B} ${p.cb} · ${esc_(p.label)} · ${esc_(p.src)}</title></line>`});
 return s+'</svg><div class="mut">Nét liền: theo sơ đồ/nhập tay (màu = nhóm nhãn) · nét đứt: theo mô tả đường đi · nét chấm: MX thẳng.</div>'}
function renderMx(name){const cabs=mxCables(name);const pairs=mxPairsFor(name,cabs);const rec=allMx().find(m=>m.name==name);
 const note=RAW.static.closures.find(c=>c.name==name);const steps=[];E.paths.forEach(p=>p.steps.forEach(s=>{if(s.t=='mx'&&s.at==name)steps.push([p,s])}));
 let h=`<div class="card"><div class="row"><h3 style="margin:0;flex:1">${esc_(name)}</h3><button onclick="curMx=null;$('#mxDetail').innerHTML='';renderMxList()">đóng</button></div>
 <div class="mut">${rec?[...rec.tags].join(' · '):''}${note?` · ${note.lat.toFixed(5)}, ${note.lon.toFixed(5)} · <a target="_blank" href="https://maps.google.com/?q=${note.lat},${note.lon}">bản đồ</a>`:''}</div>${note?`<div class="mut">${esc_(note.desc)}</div>`:''}
 ${sugBox(name)}${RAW.static.straight[name]!==undefined?`<div class="mut">MX thẳng: hàn thẳng core i↔i cho <b>${RAW.static.straight[name]}</b> core đầu (theo sổ MX).</div>`:''}`;
 if(!cabs.length)h+='<div class="mut">Chưa gắn cáp nào vào măng xông này (xem sheet DL_Cáp cột “ends”).</div>';
 cabs.forEach(x=>{h+=`<div style="margin-top:10px"><span class="b" style="cursor:pointer" onclick="goCab('${x.id}')">${x.id}</span> <span class="mut">${esc_(x.c.ma_cap||'(chưa mã)')} · ${x.c.fo}FO · ${esc_(x.c.frm)} → ${esc_(x.c.to)}${x.huong?' · hướng '+esc_(x.huong):''} <small>${x.cap&&x.cap[0]=='@'?'(MX thẳng giữa cáp, cách đầu “Từ” ~'+x.cap.slice(1)+' m)':'(đầu '+esc_(x.cap?x.cap.split('|')[1]:'?')+')'}</small></span><div class="cs">${x.cores.map(c=>coreChip(name,x.id,c)).join('')}</div></div>`});
 h+='<div class="leg"><span><i style="background:var(--ok)"></i>core đang chạy link</span><span><i style="background:var(--bad)"></i>hư</span><span style="box-shadow:inset 0 0 0 2px var(--acc);padding:0 4px;border-radius:4px">nhãn nhập tay</span><span>chấm màu = màu sợi (6 màu/ống)</span></div>';
 if(cabs.length>=2){const opts=[];for(let i=0;i<cabs.length;i++)for(let j=i+1;j<cabs.length;j++)opts.push([cabs[i].id,cabs[j].id]);
  if(!curPair||!opts.some(o=>o.join('|')==curPair)){const withP=opts.find(o=>pairs.some(p=>(p.a==o[0]&&p.b==o[1])||(p.a==o[1]&&p.b==o[0])));curPair=(withP||opts[0]).join('|')}
  h+=`<h4 style="margin:12px 0 4px">Hàn nối giữa hai cáp</h4><div class="row"><select onchange="curPair=this.value;renderMx(curMx)">${opts.map(o=>`<option value="${o.join('|')}"${o.join('|')==curPair?' selected':''}>${o[0]} ↔ ${o[1]}</option>`).join('')}</select></div>`+splicesSvg(name,cabs,pairs,...curPair.split('|'))}
 if(pairs.length){const g={};pairs.forEach(p=>{const k=[p.src,p.label,p.a,p.b].join('|');(g[k]=g[k]||[]).push(p)});
  h+='<h4 style="margin:12px 0 4px">Bảng phối core</h4><table><tr><th>Nguồn</th><th>Nhãn</th><th>Cáp A / core</th><th>Cáp B / core</th><th>Trạm</th></tr>'+Object.values(g).map(L=>`<tr><td class="mut">${esc_(L[0].src)}</td><td class="b" style="color:${L[0].label?lcol(L[0].label):'inherit'}">${esc_(L[0].label)}</td><td>${L[0].a}<br><b>${RingEngine.rng(L.map(p=>p.ca))}</b></td><td>${L[0].b}<br><b>${RingEngine.rng(L.map(p=>p.cb))}</b></td><td>${esc_([...new Set(L.map(p=>p.station).filter(Boolean))].join(', '))}</td></tr>`).join('')+'</table>'}
 if(steps.length){h+='<h4 style="margin:12px 0 4px">Link đi qua măng xông này</h4><table><tr><th>Link</th><th>Cáp A / core</th><th>Cáp B / core</th><th>Đối chiếu sơ đồ</th></tr>'+steps.map(([p,s])=>`<tr><td class="b">${p.id}</td><td>${s.a_cable}<br>${s.cores_a.join('+')}</td><td>${s.b_cable}<br>${s.cores_b.join('+')}</td><td class="${/^khớp/.test(s.check)?'ok':/^chưa/.test(s.check)?'warn':'bad'}">${esc_(s.check)}<br><small class="mut">${esc_(s.check_detail||'')}</small></td></tr>`).join('')+'</table>';
  if(steps.some(([p,s])=>/^chưa/.test(s.check)))h+=`<div class="row"><button onclick="suggestLabels('${name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">✨ Đề xuất nhãn từ đường đi</button><span class="mut">Chưa có nhãn → gợi ý nhãn A, B… theo từng link (cùng nhãn = hàn với nhau).</span></div>`}
 const ns=RAW.static.mx_notes;h+='</div><div id="coreEd"></div>';$('#mxDetail').innerHTML=h;if(curCore)editCore(curCore[0],curCore[1],true)}
// ---- sửa nhãn một core
function editCore(cid,n,keep){curCore=[cid,n];const x=mxCables(curMx).find(z=>z.id==cid);const c=x.cores[n-1];const r=RAW.layer.labels.find(l=>l.mx==curMx&&l.cable==cid&&ti(l.core)==n)||{};
 const el=$('#coreEd');if(!el)return;if(!keep)document.querySelectorAll('.cc.sel').forEach(e=>e.classList.remove('sel'));
 el.innerHTML=`<div class="card" style="border-color:var(--warn)"><div class="b">${cid} · core ${n} · ống ${c.ong}${c.mau?' · '+esc_(c.mau):''}</div><div class="mut">Sơ đồ gốc: ${esc_((diag[x.cap]||{})[n]?.nhan||'—')}${c.links.length?' · đang chạy '+c.links.join(', '):''}</div>
 <div class="fld"><label>Nhãn hàn</label><input type="text" id="ec_n" value="${esc_(r.nhan||'')}" placeholder="${esc_(c.nhan)}" maxlength="6"></div>
 <div class="fld"><label>Trạm (CSG)</label><input type="text" id="ec_t" value="${esc_(r.tram||'')}" placeholder="vd. HNB054"></div>
 <div class="fld"><label>Core hư</label><label><input type="checkbox" id="ec_h" ${(r.hu&&String(r.hu)!='0')?'checked':''}> đánh dấu hư</label></div>
 <div class="row"><button class="on" onclick="saveCore()">Lưu</button><button onclick="delCore()">Xoá nhập tay</button><button onclick="curCore=null;renderMx(curMx)">Đóng</button></div>
 <div class="mut">Cùng nhãn trong một măng xông = hàn với nhau (core nhỏ ↔ core nhỏ). Ghi vào sheet DL_Nhãn MX.</div></div>`;
 el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function saveCore(){const [cid,n]=curCore;const L=RAW.layer.labels;let r=L.find(l=>l.mx==curMx&&l.cable==cid&&ti(l.core)==n);
 const nh=$('#ec_n').value.trim(),tr=$('#ec_t').value.trim(),hu=$('#ec_h').checked?1:0;
 if(!nh&&!tr&&!hu){if(r)L.splice(L.indexOf(r),1)}else{if(!r){r={mx:curMx,cable:cid,core:n,nhan:'',tram:'',hu:0};L.push(r)}r.nhan=nh;r.tram=tr;r.hu=hu}
 touch()}
function delCore(){const [cid,n]=curCore;const L=RAW.layer.labels;const i=L.findIndex(l=>l.mx==curMx&&l.cable==cid&&ti(l.core)==n);if(i>=0)L.splice(i,1);curCore=null;touch()}
function suggestLabels(name){const items=[];E.paths.forEach(p=>p.steps.forEach(s=>{if(s.t=='mx'&&s.at==name&&/^chưa/.test(s.check))items.push([p,s])}));
 const used=new Set(RAW.layer.labels.filter(l=>l.mx==name).map(l=>String(l.nhan)));const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let k=0;const nxt=()=>{while(used.has(letters[k%26]))k++;const l=letters[k%26];used.add(l);return l};
 const seen={},add=[];items.forEach(([p,s])=>{const key=[s.a_cable,s.cores_a,s.b_cable,s.cores_b].join('|');if(!seen[key])seen[key]=nxt();const lab=seen[key],csg=p.frm.startsWith('NBE')?p.to:p.frm;
  [[s.a_cable,s.cores_a],[s.b_cable,s.cores_b]].forEach(([cb,cs])=>cs.forEach(c=>{if(!RAW.layer.labels.some(l=>l.mx==name&&l.cable==cb&&ti(l.core)==c&&l.nhan))add.push({mx:name,cable:cb,core:c,nhan:lab,tram:csg,hu:0})}))});
 if(!add.length){alert('Không có gì để thêm.');return}
 if(!confirm('Thêm '+add.length+' nhãn đề xuất cho '+name+'?\n'+[...new Set(add.map(a=>a.nhan+' = '+a.tram))].join('\n')+'\n\nĐây chỉ là gợi ý từ đường đi bạn mô tả, không phải đọc từ sơ đồ gốc — kiểm tra lại với sơ đồ MX.'))return;
 add.forEach(a=>{const r=RAW.layer.labels.find(l=>l.mx==a.mx&&l.cable==a.cable&&ti(l.core)==a.core);if(r)Object.assign(r,a);else RAW.layer.labels.push(a)});touch()}
renderSrc();renderMxList();

// ---- đề xuất MX thẳng (từ suggest_straight.py)
const SUG={};(RAW.static.suggest?RAW.static.suggest.items:[]).forEach(i=>SUG[i.name]=i);
function sugBox(name){const s=SUG[name];if(!s)return '';const attached=Object.values(E.cables).some(c=>c.ends&&c.ends[name]&&String(c.ends[name])[0]=='@');
 let h=`<div class="card" style="border-color:var(--warn)"><div class="b">Đề xuất vị trí (MX thẳng chỉ có trong KML)</div><div class="mut">MX thẳng = hàn nối dài cáp, core i↔i, không rẽ nhánh. Độ tin cậy: ${esc_(s.conf)}${attached?' · <b class="ok">đã gắn vào cáp</b>':''}</div>`;
 if(!s.cables.length)h+='<div class="warn">Chưa xác định được cáp: cần biết chỉ số mét hoặc vị trí các MX lân cận.</div>';
 s.cables.forEach(c=>{const row=cabRow(c.cable)||{};const on=String(((row.ends||'').split(';').map(x=>x.trim()).find(x=>x.startsWith(name+'='))||'')).length>0;
  h+=`<div class="row"><span><b style="cursor:pointer" onclick="goCab('${c.cable}')">${c.cable}</b> ${esc_(row.ma_cap||'')} ${c.fo}FO · ${esc_(c.frm)} → ${esc_(c.to)} · dài ${c.len_m} m<br>cách đầu “${esc_(c.frm)}” ≈ <b>${c.off_m} m</b> · lệch tuyến ${c.lat_m} m · link ${c.links.join(', ')}</span>${on?'<span class="ok">✓ đã gắn</span>':`<button onclick="attachSug('${name.replace(/'/g,"\\'")}','${c.cable}',${c.off_m})">Gắn vào ${c.cable}</button>`}</div>`});
 if(s.maybe_same_as.length)h+='<div class="mut">Có thể chính là MX trong đường đi: '+s.maybe_same_as.map(m=>`<b>${esc_(m.mx)}</b> (cách ${m.dist_m} m)`).join(', ')+' — nếu đúng, hai tên là một điểm.</div>';
 return h+'</div>'}
function attachSug(name,cid,off){const r=cabRow(cid);if(!r)return;const parts=String(r.ends||'').split(';').map(x=>x.trim()).filter(x=>x&&!x.startsWith(name+'='));parts.push(name+'=@'+off);r.ends=parts.join('; ');touch()}

// ===== thu phóng / kéo bản đồ =====
(function(){const svg=$('#map');let vb0=svg.getAttribute('viewBox').split(' ').map(Number);let vb=vb0.slice();
 const set=()=>svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));
 const pt=(cx,cy)=>{const r=svg.getBoundingClientRect(),s=Math.max(vb[2]/r.width,vb[3]/r.height);const ox=(r.width-vb[2]/s)/2,oy=(r.height-vb[3]/s)/2;return [vb[0]+(cx-r.left-ox)*s,vb[1]+(cy-r.top-oy)*s,s]};
 function zoom(f,cx,cy){const r=svg.getBoundingClientRect();if(cx===undefined){cx=r.left+r.width/2;cy=r.top+r.height/2}const [px,py]=pt(cx,cy);let nw=vb[2]/f,nh=vb[3]/f;if(nw>vb0[2]*1.3||nw<vb0[2]/40){return}
  vb=[px-(px-vb[0])/f,py-(py-vb[1])/f,nw,nh];set();svg.style.setProperty('--z',vb0[2]/vb[2])}
 $('#zIn').onclick=()=>zoom(1.6);$('#zOut').onclick=()=>zoom(1/1.6);$('#zRst').onclick=()=>{vb=vb0.slice();set()};
 svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
 const P=new Map();let moved=false,last=null,d0=0;
 svg.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;if(P.size==1)last=[e.clientX,e.clientY];if(P.size==2){const [a,b]=[...P.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
 svg.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size==1){const dx=e.clientX-last[0],dy=e.clientY-last[1];if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;const s=pt(0,0)[2];vb[0]-=dx*s;vb[1]-=dy*s;last=[e.clientX,e.clientY];set()}
  else if(P.size==2){moved=true;const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0){zoom(d/d0,(a[0]+b[0])/2,(a[1]+b[1])/2)}d0=d}});
 const up=e=>{P.delete(e.pointerId);if(P.size<2)d0=0;if(P.size==1){last=[...P.values()][0]}};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
 svg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
})();

  if(steps.length)h+='<div class="b" style="margin-top:8px">Link đi qua</div><table>'+steps.map(([p,s])=>`<tr><td class="b">${p.id}</td><td>${s.a_cable} ${s.cores_a.join('+')} ↔ ${s.b_cable} ${s.cores_b.join('+')}</td><td class="${/^khớp/.test(s.check)?'ok':/^chưa/.test(s.check)?'warn':'bad'}">${esc_(String(s.check).slice(0,40))}</td></tr>`).join('')+'</table>';
  h+=`<div class="row"><button class="on" onclick="goMx('${q}')">Mở trang MX (sửa nhãn)</button></div>`;openSheet(h)};popFn()}
const _refresh=refresh;refresh=function(){_refresh();if(popFn&&$('#sheet').classList.contains('on'))popFn()};

renderRingSel();draw();
</script></body></html>
